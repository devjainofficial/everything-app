# gateway/config.yaml
# The LiteLLM proxy config = the choke point every model call passes through.
# It is just a LOOKUP TABLE: nickname (what our code says) -> real model (what the gateway calls).
# Swapping a model later = editing a right-hand value here, with ZERO code changes.

model_list:
  # ── Row 1: the default brain (local, free) ────────────────────────────────
  # (We proved this row can point anywhere; reverted to local Llama as the cheap dev default.)
  - model_name: default-brain            # NICKNAME our code uses; it never names a provider
    litellm_params:
      model: ollama_chat/llama3.2:3b     # back to local Llama (free, fast iteration during dev)
      api_base: http://localhost:11434   # Ollama server address

  # ── Row 2: the cloud brain (Azure OpenAI) — used for RAG answer synthesis ─
  - model_name: azure-brain
    litellm_params:
      model: os.environ/AZURE_MODEL
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION

  # ── Row 3: the embedder (local, free) — turns text into vectors for RAG ────
  - model_name: embedder                 # NICKNAME the backend uses to embed text
    litellm_params:
      model: ollama/nomic-embed-text     # 'ollama/' (NOT ollama_chat) = Ollama's EMBEDDINGS endpoint
      api_base: http://localhost:11434   # same local Ollama server

# ── Gateway-wide settings ──────────────────────────────────────────────────
litellm_settings:
  drop_params: true   # silently drop params a provider doesn't support (e.g. Ollama rejects
                      # 'encoding_format') instead of erroring — the gateway smoothing over
                      # provider quirks so callers don't have to special-case each backend.
